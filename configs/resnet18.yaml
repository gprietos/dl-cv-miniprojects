train:
  grad_accum_steps: 1
  batch_size:       256
  epochs:           100
  # Optimizer.
  base_lr:          0.0001
  weight_decay:     1.0e-6
  # spectral:         False
  optimizer:        'AdamW'   # 'AdamW', 'LARS', 'SGD', 'Muon'
  # Clip gradients.
  clip_grad:        True
  max_grad_norm:    1.0
  # Number of slices & points for SIGReg.
  # num_slices:       256
  # num_points:       17

model:
  backbone_name:       'resnet18'
  compile_model:        False
  # Precision
  dtype:               'bfloat16'

